<aside
  class="flex h-screen shrink-0 flex-col border-r border-line bg-panel"
  [class.w-60]="variant() === 'admin'"
  [class.w-72]="variant() === 'client'"
>
  <div class="flex items-center gap-3 px-5 py-6">
    <img src="nauti-logo.png" alt="Nauti" class="h-9 w-auto max-w-full shrink-0 object-contain" />
    <p class="flex items-center gap-1.5 font-mono text-[11px] tracking-wide text-muted">
      <span class="size-1.5 animate-pulse rounded-full bg-neon"></span>
      @if (variant() === 'admin') {
        Super admin
      } @else {
        Client portal
      }
    </p>
  </div>

  <nav class="flex min-h-0 flex-1 flex-col gap-1 px-3">
    @if (variant() === 'admin') {
      <a
        routerLink="/assistant"
        routerLinkActive="border-neon/40 bg-neon/10 text-neon"
        class="flex items-center gap-3 rounded border border-transparent px-3 py-2.5 text-sm text-muted hover:border-line hover:text-ink"
      >
        <svg [lucideIcon]="icons.assistant" class="size-4"></svg>
        Assistant
      </a>

      <a
        routerLink="/negotiations"
        routerLinkActive="border-neon/40 bg-neon/10 text-neon"
        class="flex items-center gap-3 rounded border border-transparent px-3 py-2.5 text-sm text-muted hover:border-line hover:text-ink"
      >
        <svg [lucideIcon]="icons.negotiations" class="size-4 shrink-0"></svg>
        <span class="leading-tight">Negotiations</span>
      </a>

      <a
        routerLink="/carriers"
        routerLinkActive="border-neon/40 bg-neon/10 text-neon"
        class="flex items-center gap-3 rounded border border-transparent px-3 py-2.5 text-sm text-muted hover:border-line hover:text-ink"
      >
        <svg [lucideIcon]="icons.truck" class="size-4"></svg>
        Carriers
      </a>

      <a
        routerLink="/client"
        routerLinkActive="border-neon/40 bg-neon/10 text-neon"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 rounded border border-transparent px-3 py-2.5 text-sm text-muted hover:border-line hover:text-ink"
      >
        <svg [lucideIcon]="icons.client" class="size-4"></svg>
        Clients
      </a>

      <a
        routerLink="/quote-history"
        routerLinkActive="border-neon/40 bg-neon/10 text-neon"
        class="flex items-center gap-3 rounded border border-transparent px-3 py-2.5 text-sm text-muted hover:border-line hover:text-ink"
      >
        <svg [lucideIcon]="icons.history" class="size-4"></svg>
        Quote History
      </a>

      <a
        routerLink="/logs"
        routerLinkActive="border-neon/40 bg-neon/10 text-neon"
        class="flex items-center gap-3 rounded border border-transparent px-3 py-2.5 text-sm text-muted hover:border-line hover:text-ink"
      >
        <svg [lucideIcon]="icons.logs" class="size-4"></svg>
        Logs
      </a>
    } @else {
      <app-conversation-list class="flex min-h-0 flex-1 flex-col" />
    }
  </nav>

  <div class="space-y-1 px-3 pb-6">
    @if (canSwitchView()) {
      <button
        type="button"
        class="flex w-full items-center justify-between gap-3 rounded px-3 py-2 text-left text-sm text-muted hover:text-ink"
        (click)="toggleView()"
      >
        <span class="flex min-w-0 items-center gap-3">
          <svg [lucideIcon]="icons.view" class="size-4 shrink-0"></svg>
          <span class="min-w-0 truncate">{{ viewingClient() ? 'Client view' : 'Super admin' }}</span>
        </span>
        <span
          class="relative h-5 w-9 shrink-0 rounded-full border border-line"
          [class.bg-neon/20]="viewingClient()"
        >
          <span
            class="absolute top-0.5 size-3.5 rounded-full bg-ink transition-[left]"
            [class.left-4]="viewingClient()"
            [class.left-0.5]="!viewingClient()"
          ></span>
        </span>
      </button>
    }

    <app-theme-toggle />

    <p class="flex items-center gap-3 rounded px-3 py-2 text-sm text-ink">
      <svg [lucideIcon]="icons.account" class="size-4 shrink-0 text-muted"></svg>
      <span class="min-w-0 truncate">{{ email() || 'Account' }}</span>
    </p>

    <button
      type="button"
      class="flex w-full items-center gap-3 rounded px-3 py-2 text-left text-sm text-muted hover:text-ink"
      (click)="logout()"
    >
      <svg [lucideIcon]="icons.logout" class="size-4"></svg>
      Sign out
    </button>
  </div>
</aside>
